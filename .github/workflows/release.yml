name: Build and Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore Firebase configurations
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 -d > lib/firebase_options.dart
          echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: |
          flutter analyze lib/
          flutter test
          npm --prefix test_backend test

      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Configure Keystore
        run: |
          cat << 'EOF' > android/key.properties
          storePassword=nexmusic123
          keyPassword=nexmusic123
          keyAlias=nexmusic
          storeFile=nexmusic-release.jks
          EOF

      - name: Build one universal Android APK
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --obfuscate --split-debug-info=build/symbols --extra-gen-snapshot-options=--strip
          npm ci --prefix tool/small_apk --no-audit --no-fund
          mkdir -p build/optimized
          node tool/small_apk/repack-apk.cjs build/app/outputs/flutter-apk/app-release.apk build/optimized/unsigned.apk 5
          node tool/small_apk/sign-release.cjs build/optimized/unsigned.apk build/optimized/nexMusic.apk
          # Compression must retain every supported architecture and app file.
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk') as before, zipfile.ZipFile('build/optimized/nexMusic.apk') as after:
              entries = lambda z: {i.filename: (i.CRC, i.file_size) for i in z.infolist() if not i.filename.upper().startswith('META-INF/')}
              assert entries(before) == entries(after), 'APK contents changed during compression'
              for abi in ['armeabi-v7a', 'arm64-v8a', 'x86_64']:
                  assert f'lib/{abi}/libflutter.so' in after.namelist()
                  assert f'lib/{abi}/libapp.so' in after.namelist()
          PY

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          cp build/optimized/nexMusic.apk release_assets/nexMusic.apk

      - name: Verify packaged version and app label
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          BUILD_NUMBER="${RELEASE_VERSION##*+}"
          VERSION_NAME="${RELEASE_VERSION%%+*}"
          for apk in release_assets/*.apk; do
            BADGING=$("$AAPT" dump badging "$apk")
            [[ "$BADGING" == *"versionCode='$BUILD_NUMBER'"* ]]
            [[ "$BADGING" == *"versionName='$VERSION_NAME'"* ]]
            [[ "$BADGING" == *"application-label:'nexMusic'"* ]]
            [[ "$BADGING" == *"name='com.thenex.nex_music'"* ]]
            echo "Verified $apk: nexMusic $RELEASE_VERSION"
          done

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "nexMusic ${{ steps.get_version.outputs.tag }}"
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release_assets/nexMusic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
